server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 🔥 CRÍTICO: Redirige todas las peticiones a index.html para que React Router tome el control
        try_files $uri $uri/ /index.html;
    }

    # index.html es el que apunta a los archivos con hash de /assets: si el navegador
    # lo guarda en caché, tras un despliegue pide archivos que ya no existen
    # (NS_ERROR_CORRUPTED_CONTENT / "MIME text/html" en consola). Siempre se revalida.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Caché optimizada para assets estáticos (JS, CSS, Imágenes).
    # Los nombres llevan hash, así que son inmutables. Si un archivo no existe se
    # responde 404 de verdad: nunca el index.html del fallback SPA, que el navegador
    # rechaza como módulo JS por su tipo MIME.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}