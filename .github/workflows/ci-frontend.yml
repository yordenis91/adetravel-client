name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Inspector de Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: 🔎 Comprobar tipos (tsc)
        run: npm run typecheck

      # Línea base de 457 avisos heredados (420 son `any`): el CI falla si aparece uno nuevo.
      - name: 🔎 Lint (sin avisos nuevos)
        run: npm run lint:ci

      # Solo dependencias de producción. Falla con severidad alta o crítica; las moderadas
      # (uuid vía exceljs, sin corrección que no sea un retroceso de versión) se revisan aparte.
      - name: 🛡️ Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: 🧪 Ejecutar tests con cobertura (todo src/)
        run: npm run test:coverage

      # La cobertura de todo src/ queda a la vista en el resumen de cada ejecución.
      - name: 📊 Publicar cobertura en el resumen
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("coverage/coverage-summary.json")) process.exit(0);
          const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
          const row = (k, n) => `| ${n} | ${t[k].pct} % | ${t[k].covered} / ${t[k].total} |`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ["### Cobertura del cliente (todo src/)", "", "| Métrica | Cobertura | Cubierto |", "|---|---|---|", row("statements", "Sentencias"), row("branches", "Ramas"), row("functions", "Funciones"), row("lines", "Líneas"), ""].join("\n"));
          '

      - name: 🔨 Construir Vite
        env:
          VITE_API_URL: "http://localhost:3000/api"
          VITE_SENTRY_DSN: "https://dummy@sentry.io/0"
        run: npm run build

      # Solo dispara el deploy en un push real a main (mergeado), nunca en el
      # build de un Pull Request todavía sin mergear. El token vive en un
      # GitHub Secret, no en texto plano (ver README del repo / PR de rotación).
      - name: 🚀 Notificar a EasyPanel (despliegue FrontEnd)
        if: github.event_name == 'push' && success()
        run: |
          curl -X POST "${{ secrets.EASYPANEL_FRONTEND_DEPLOY_HOOK }}"

