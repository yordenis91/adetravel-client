version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # jsdom 30 rompe la suite de pruebas (42 errores no controlados en Vitest). Las versiones
      # menores y los parches siguen llegando.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      # ESLint y sus complementos se actualizan siempre juntos: @eslint/js 10 exige eslint 10.
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
      # Agrupa las actualizaciones menores y de parche para no recibir un PR por paquete.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
