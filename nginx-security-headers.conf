# Cabeceras de seguridad. Se incluyen en el server y en CADA location que tenga su
# propio add_header: en nginx, un add_header dentro de un location anula todos los
# heredados del server, así que sin repetir el include esas rutas quedarían sin ellas.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# CSP en modo solo-informe: el navegador avisa en la consola de lo que bloquearía, sin
# bloquear nada. Cuando la consola de la demo quede limpia, cambiar el nombre de la
# cabecera a Content-Security-Policy para aplicarla. connect-src admite https: porque la
# URL de la API (VITE_API_URL) y la de Sentry dependen del entorno.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
